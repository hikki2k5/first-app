name: CD (Deploy to Railway)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [ "staging", "production"]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    container: ghcr.io/railwayapp/cli:latest

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SVC_ID: ${{ secrets.RAILWAY_SERVICE }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        shell: bash
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          case "$BRANCH" in
            develop) ENV="development" ;;
            staging) ENV="staging" ;;
            production) ENV="production" ;;
            *) echo "No deploy mapping for branch=$BRANCH"; exit 1 ;;
          esac

          echo "Deploying branch=$BRANCH to Railway env=$ENV service=$SVC_ID"
          railway up --service="$SVC_ID" --environment="$ENV" --detach
